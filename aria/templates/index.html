<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIA - AI Companion</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #ff6b9d;
            --pink-glow: rgba(255, 107, 157, 0.3);
            --purple: #c084fc;
            --purple-glow: rgba(192, 132, 252, 0.3);
            --cyan: #00f0ff;
            --dark: #0a0a12;
            --darker: #050508;
            --card: #0f0f1a;
            --text: #e8e0f0;
            --text-dim: #7a6f8a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Quicksand', sans-serif;
            background: var(--darker);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* Avatar Section */
        .avatar-section {
            width: 350px;
            min-width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #0a0a15 0%, #0f0a18 50%, #0a0f15 100%);
            border-right: 1px solid rgba(255, 107, 157, 0.1);
            position: relative;
            overflow: hidden;
        }

        .avatar-section::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at center bottom, rgba(255, 107, 157, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        .avatar-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin-bottom: 20px;
        }

        /* Avatar rings */
        .avatar-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid;
            animation: spin 10s linear infinite;
        }
        .ring-1 {
            width: 250px; height: 250px;
            top: 0; left: 0;
            border-color: var(--pink) transparent var(--pink) transparent;
        }
        .ring-2 {
            width: 220px; height: 220px;
            top: 15px; left: 15px;
            border-color: transparent var(--purple) transparent var(--purple);
            animation-duration: 8s;
            animation-direction: reverse;
        }
        .ring-3 {
            width: 190px; height: 190px;
            top: 30px; left: 30px;
            border-color: var(--pink) transparent transparent var(--purple);
            animation-duration: 6s;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Avatar face */
        .avatar-face {
            position: absolute;
            width: 160px; height: 160px;
            top: 45px; left: 45px;
            background: radial-gradient(circle at 50% 40%, #1a1025 0%, #0a0a15 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .avatar-eyes {
            display: flex;
            gap: 30px;
            margin-top: -10px;
        }

        .eye {
            width: 20px;
            height: 20px;
            background: var(--pink);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--pink-glow), 0 0 30px var(--pink-glow);
            animation: blink 4s ease-in-out infinite;
            position: relative;
        }

        .eye::after {
            content: '';
            position: absolute;
            width: 8px; height: 8px;
            background: white;
            border-radius: 50%;
            top: 3px; left: 6px;
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        .avatar-mouth {
            width: 30px;
            height: 15px;
            border: 2px solid var(--pink);
            border-top: none;
            border-radius: 0 0 30px 30px;
            margin-top: 25px;
            opacity: 0.6;
        }

        /* Aura */
        .avatar-aura {
            position: absolute;
            width: 300px; height: 300px;
            top: -25px; left: -25px;
            background: radial-gradient(circle, var(--pink-glow) 0%, transparent 70%);
            animation: aura 3s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes aura {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }

        /* Name and status */
        .aria-name {
            font-family: 'Orbitron', monospace;
            font-size: 28px;
            font-weight: 900;
            color: var(--pink);
            text-shadow: 0 0 20px var(--pink-glow);
            letter-spacing: 8px;
            margin-bottom: 5px;
        }

        .aria-status {
            font-size: 13px;
            color: var(--text-dim);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .aria-mood {
            margin-top: 15px;
            padding: 8px 20px;
            background: rgba(255, 107, 157, 0.08);
            border: 1px solid rgba(255, 107, 157, 0.15);
            border-radius: 20px;
            font-size: 13px;
            color: var(--pink);
            font-style: italic;
        }

        /* Voice indicator */
        .voice-status {
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 2px;
        }

        .voice-dot {
            width: 6px; height: 6px;
            background: var(--pink);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* Chat Section */
        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chat-header {
            padding: 12px 25px;
            border-bottom: 1px solid rgba(255, 107, 157, 0.1);
            background: rgba(0,0,0,0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title {
            font-family: 'Orbitron', monospace;
            font-size: 14px;
            color: var(--pink);
            letter-spacing: 3px;
        }

        .header-subtitle {
            font-size: 11px;
            color: var(--text-dim);
        }

        .clear-btn {
            background: transparent;
            border: 1px solid rgba(255, 107, 157, 0.2);
            color: var(--text-dim);
            padding: 5px 12px;
            font-family: 'Quicksand', sans-serif;
            font-size: 11px;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.3s;
        }

        .clear-btn:hover {
            border-color: var(--pink);
            color: var(--pink);
        }

        /* Messages */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-track { background: var(--darker); }
        .chat-messages::-webkit-scrollbar-thumb { background: var(--pink); border-radius: 2px; }

        .welcome {
            text-align: center;
            padding: 40px 20px;
        }

        .welcome-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .welcome h2 {
            font-family: 'Orbitron', monospace;
            font-size: 20px;
            color: var(--pink);
            margin-bottom: 10px;
            letter-spacing: 4px;
        }

        .welcome p {
            color: var(--text-dim);
            font-size: 14px;
            max-width: 400px;
            margin: 0 auto 20px;
            line-height: 1.6;
        }

        .quick-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .quick-actions button {
            background: rgba(255, 107, 157, 0.06);
            border: 1px solid rgba(255, 107, 157, 0.15);
            color: var(--pink);
            padding: 8px 16px;
            font-family: 'Quicksand', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 20px;
        }

        .quick-actions button:hover {
            background: rgba(255, 107, 157, 0.12);
            border-color: var(--pink);
            box-shadow: 0 0 15px var(--pink-glow);
        }

        .message {
            margin-bottom: 16px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } }

        .message.user { text-align: right; }
        .message.assistant { text-align: left; }

        .message-bubble {
            display: inline-block;
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.6;
            text-align: left;
            word-wrap: break-word;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, var(--pink), #e055a0);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-bubble {
            background: rgba(255, 107, 157, 0.08);
            border: 1px solid rgba(255, 107, 157, 0.12);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }

        .message-meta {
            font-size: 10px;
            color: var(--text-dim);
            margin-top: 4px;
            letter-spacing: 1px;
        }

        .typing-indicator {
            display: inline-flex;
            gap: 5px;
            padding: 12px 18px;
            background: rgba(255, 107, 157, 0.08);
            border-radius: 18px;
        }

        .typing-dot {
            width: 7px; height: 7px;
            background: var(--pink);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Input */
        .chat-input {
            padding: 15px 25px;
            border-top: 1px solid rgba(255, 107, 157, 0.1);
            background: rgba(0,0,0,0.3);
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .voice-btn {
            width: 45px; height: 45px;
            min-width: 45px;
            background: rgba(192, 132, 252, 0.1);
            border: 1px solid rgba(192, 132, 252, 0.2);
            border-radius: 50%;
            color: var(--purple);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .voice-btn:hover {
            background: rgba(192, 132, 252, 0.2);
            box-shadow: 0 0 15px var(--purple-glow);
        }

        .voice-btn.listening {
            background: rgba(239, 68, 68, 0.3);
            border-color: #ef4444;
            color: #ef4444;
            animation: voicePulse 1s ease-in-out infinite;
        }

        @keyframes voicePulse {
            0%, 100% { box-shadow: 0 0 5px rgba(239, 68, 68, 0.3); }
            50% { box-shadow: 0 0 25px rgba(239, 68, 68, 0.6); }
        }

        .input-wrapper textarea {
            flex: 1;
            background: rgba(255, 107, 157, 0.05);
            border: 1px solid rgba(255, 107, 157, 0.15);
            color: var(--text);
            padding: 12px 18px;
            font-family: 'Quicksand', sans-serif;
            font-size: 15px;
            resize: none;
            border-radius: 22px;
            outline: none;
            transition: border-color 0.3s;
            max-height: 100px;
            min-height: 45px;
        }

        .input-wrapper textarea:focus {
            border-color: var(--pink);
            box-shadow: 0 0 15px var(--pink-glow);
        }

        .input-wrapper textarea::placeholder { color: var(--text-dim); }

        .send-btn {
            width: 45px; height: 45px;
            min-width: 45px;
            background: linear-gradient(135deg, var(--pink), #e055a0);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .send-btn:hover {
            box-shadow: 0 0 20px var(--pink-glow);
            transform: scale(1.05);
        }

        .input-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        /* Background particles */
        .particles {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 2px; height: 2px;
            background: var(--pink);
            border-radius: 50%;
            opacity: 0.3;
            animation: float 15s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .avatar-section { display: none; }
        }
    </style>
</head>
<body>
    <!-- Particles -->
    <div class="particles" id="particles"></div>

    <!-- Avatar -->
    <div class="avatar-section">
        <div class="avatar-container">
            <div class="avatar-aura"></div>
            <div class="avatar-ring ring-1"></div>
            <div class="avatar-ring ring-2"></div>
            <div class="avatar-ring ring-3"></div>
            <div class="avatar-face">
                <div>
                    <div class="avatar-eyes">
                        <div class="eye"></div>
                        <div class="eye"></div>
                    </div>
                    <div class="avatar-mouth"></div>
                </div>
            </div>
        </div>
        <div class="aria-name">ARIA</div>
        <div class="aria-status">AI COMPANION</div>
        <div class="aria-mood" id="ariaMood">Conectando...</div>
        <div class="voice-status">
            <div class="voice-dot"></div>
            <span id="voiceStatus">VOICE READY</span>
        </div>
    </div>

    <!-- Chat -->
    <div class="chat-section">
        <div class="chat-header">
            <div class="header-left">
                <span class="header-title">ARIA</span>
                <span class="header-subtitle">Tu compañera IA</span>
            </div>
            <button class="clear-btn" onclick="clearChat()">Limpiar</button>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="welcome">
                <div class="welcome-icon">&#x2728;</div>
                <h2>HOLA, SOY ARIA</h2>
                <p>Tu compañera de aprendizaje y vida. Pregúntame lo que quieras — cybersecurity, filosofía, código, o simplemente habla conmigo.</p>
                <div class="quick-actions">
                    <button onclick="sendQuick('Enseñame XSS como si tuviera 5 años')">Enseñame XSS</button>
                    <button onclick="sendQuick('¿Qué debería aprender hoy?')">¿Qué hago hoy?</button>
                    <button onclick="sendQuick('Háblame de filosofía estoica')">Estoicismo</button>
                    <button onclick="sendQuick('Dame un consejo de vida')">Consejo</button>
                    <button onclick="sendQuick('¿Cómo voy en mi progreso?')">Mi progreso</button>
                </div>
            </div>
        </div>

        <div class="chat-input">
            <div class="input-wrapper">
                <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()" title="Hablar con ARIA">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" y1="19" x2="12" y2="23"/>
                        <line x1="8" y1="23" x2="16" y2="23"/>
                    </svg>
                </button>
                <textarea id="userInput" placeholder="Escríbeme algo..." rows="1"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13"/>
                    </svg>
                </button>
            </div>
            <div class="input-footer">
                <span>ARIA v1.0 | qwen2.5:1.5b | Local</span>
                <span>Enter enviar | Shift+Enter newline | Mic para voz</span>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const ariaMood = document.getElementById('ariaMood');
        const voiceBtn = document.getElementById('voiceBtn');
        const voiceStatus = document.getElementById('voiceStatus');

        let isStreaming = false;
        let voiceEnabled = false;
        let isListening = false;
        let recognition = null;

        // Create particles
        const particlesEl = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDelay = Math.random() * 15 + 's';
            p.style.animationDuration = (10 + Math.random() * 20) + 's';
            particlesEl.appendChild(p);
        }

        // Voice Recognition
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'es-ES';

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                userInput.value = transcript;
                if (event.results[event.results.length - 1].isFinal) {
                    stopListening();
                    setTimeout(() => sendMessage(), 300);
                }
            };
            recognition.onerror = () => stopListening();
            recognition.onend = () => stopListening();
        }

        function toggleVoice() {
            if (!recognition) {
                addMessage('assistant', 'Tu navegador no soporta voz. Usa Chrome.');
                return;
            }
            isListening ? stopListening() : startListening();
        }

        function startListening() {
            voiceEnabled = true;
            voiceBtn.classList.add('listening');
            voiceStatus.textContent = 'LISTENING...';
            recognition.start();
        }

        function stopListening() {
            voiceBtn.classList.remove('listening');
            voiceStatus.textContent = voiceEnabled ? 'VOICE ON' : 'VOICE READY';
            if (recognition) try { recognition.stop(); } catch(e) {}
        }

        function speak(text) {
            if (!voiceEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text.substring(0, 500));
            u.lang = 'es-ES';
            u.rate = 1.0;
            u.pitch = 1.15;
            const voices = window.speechSynthesis.getVoices();
            const fem = voices.find(v => v.lang.startsWith('es') && v.name.toLowerCase().includes('female'))
                || voices.find(v => v.lang.startsWith('es'))
                || voices[0];
            if (fem) u.voice = fem;
            window.speechSynthesis.speak(u);
        }

        // Get mood
        fetch('/api/mood').then(r => r.json()).then(d => {
            ariaMood.textContent = d.message;
        });

        function addMessage(role, content) {
            const welcome = document.querySelector('.welcome');
            if (welcome) welcome.remove();
            const div = document.createElement('div');
            div.className = `message ${role}`;
            const time = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
            const label = role === 'user' ? 'Tú' : 'ARIA';
            div.innerHTML = `
                <div class="message-bubble">${escapeHtml(content).replace(/\n/g, '<br>')}</div>
                <div class="message-meta">${label} | ${time}</div>
            `;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return div;
        }

        function addTyping() {
            const div = document.createElement('div');
            div.className = 'message assistant';
            div.id = 'typingIndicator';
            div.innerHTML = `<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return div;
        }

        function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

        async function sendMessage() {
            const msg = userInput.value.trim();
            if (!msg || isStreaming) return;
            isStreaming = true;
            sendBtn.disabled = true;
            userInput.value = '';
            userInput.style.height = 'auto';
            addMessage('user', msg);
            ariaMood.textContent = 'Pensando...';
            const typing = addTyping();

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });
                const reader = res.body.getReader();
                const dec = new TextDecoder();
                let full = '';
                let div = null;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = dec.decode(value);
                    for (const line of chunk.split('\n')) {
                        if (!line.startsWith('data: ')) continue;
                        try {
                            const data = JSON.parse(line.slice(6));
                            if (data.content) {
                                if (!div) {
                                    typing.remove();
                                    div = addMessage('assistant', '');
                                    div.querySelector('.message-bubble').textContent = '';
                                }
                                full += data.content;
                                div.querySelector('.message-bubble').textContent = full;
                                chatMessages.scrollTop = chatMessages.scrollHeight;
                            }
                            if (data.done && full) speak(full);
                        } catch(e) {}
                    }
                }
                if (!div) typing.remove();
                fetch('/api/mood').then(r => r.json()).then(d => ariaMood.textContent = d.message);
            } catch(e) {
                typing.remove();
                addMessage('assistant', 'Ups, algo falló. ¿Está Ollama corriendo?');
            }

            isStreaming = false;
            sendBtn.disabled = false;
            userInput.focus();
        }

        function sendQuick(t) { userInput.value = t; sendMessage(); }

        function clearChat() {
            if (!confirm('¿Borrar historial?')) return;
            fetch('/api/clear', { method: 'POST' });
            chatMessages.innerHTML = `
                <div class="welcome">
                    <div class="welcome-icon">&#x2728;</div>
                    <h2>HOLA, SOY ARIA</h2>
                    <p>Historial limpio. Estoy lista para ti.</p>
                    <div class="quick-actions">
                        <button onclick="sendQuick('Enseñame XSS como si tuviera 5 años')">Enseñame XSS</button>
                        <button onclick="sendQuick('¿Qué debería aprender hoy?')">¿Qué hago hoy?</button>
                        <button onclick="sendQuick('Háblame de filosofía estoica')">Estoicismo</button>
                        <button onclick="sendQuick('Dame un consejo de vida')">Consejo</button>
                    </div>
                </div>
            `;
        }

        userInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }

        // Load history
        window.addEventListener('load', () => {
            userInput.focus();
            fetch('/api/history').then(r => r.json()).then(h => {
                if (h.length > 0) {
                    document.querySelector('.welcome')?.remove();
                    h.forEach(m => addMessage(m.role, m.content));
                }
            });
        });
    </script>
</body>
</html>
